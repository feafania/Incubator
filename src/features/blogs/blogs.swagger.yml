paths:
  /blogs:
    get:
      summary: Returns a list of blogs with pagination, sorting, and search
      tags: [Blogs]
      parameters:
        - name: searchNameTerm
          in: query
          description: Search term for filtering blogs by name (contains, case-insensitive)
          required: false
          schema:
            type: string
            nullable: true
            example: "tech"
        - name: sortBy
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: [id, name, description, websiteUrl, createdAt]
            default: createdAt
        - name: sortDirection
          in: query
          description: Sorting direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: pageNumber
          in: query
          description: Number of the page to return
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        200:
          description: List of blogs returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagesCount:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalCount:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Blog'
    post:
      summary: Create a new blog
      tags: [Blogs]
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogInput'
      responses:
        201:
          description: Blog successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
        400:
          description: Validation error
        401:
          description: Unauthorized
    delete:
      summary: Delete all blogs
      tags: [Blogs]
      security:
        - basicAuth: []
      responses:
        204:
          description: All blogs deleted successfully
        401:
          description: Unauthorized

  /blogs/{id}:
    get:
      summary: Get a blog by its ID
      tags: [Blogs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Blog found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
        404:
          description: Blog not found
    put:
      summary: Update an existing blog by ID
      tags: [Blogs]
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogInput'
      responses:
        204:
          description: Blog updated successfully
        400:
          description: Validation error
        401:
          description: Unauthorized
        404:
          description: Blog not found
    delete:
      summary: Delete a blog by ID
      tags: [Blogs]
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Blog deleted successfully
        401:
          description: Unauthorized
        404:
          description: Blog not found

  /blogs/{id}/posts:
    get:
      summary: Get posts for a specific blog
      tags: [Posts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [id, title, createdAt]
            default: createdAt
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Posts for this blog returned successfully
    post:
      summary: Create a post for the specified blog
      tags: [Posts]
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        201:
          description: Post successfully created
        400:
          description: Validation error
        401:
          description: Unauthorized
        404:
          description: Blog not found