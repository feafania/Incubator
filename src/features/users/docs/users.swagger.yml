openapi: 3.0.0
info:
  title: Users API Documentation
  version: 1.0.0

securitySchemes:
  BasicAuth:
    type: http
    scheme: basic

tags:
  - name: Users
    description: API for managing users

paths:
  /users:
    get:
      summary: Get a paginated and sorted list of users
      tags: [Users]
      security:
        - BasicAuth: []
      parameters:
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, login, email]
            default: createdAt
          description: Field to sort by
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
        - in: query
          name: pageNumber
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (number of portions that should be returned)
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Page size (portion size that should be returned)
        - in: query
          name: searchLoginTerm
          schema:
            type: string
            nullable: true
            default: null
          description: Search term for user login
        - in: query
          name: searchEmailTerm
          schema:
            type: string
            nullable: true
            default: null
          description: Search term for user email
      responses:
        200:
          description: Success — list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListPaginatedOutput"
        401:
          description: Unauthorized
    post:
      summary: Add a new user to the system
      tags: [Users]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOutput"
        400:
          description: Validation error (incorrect input model)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        401:
          description: Unauthorized

  /users/{id}:
    delete:
      summary: Delete user by ID
      tags: [Users]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: User ID
          schema:
            type: string
      responses:
        204:
          description: No Content — user deleted successfully
        401:
          description: Unauthorized
        404:
          description: User not found

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

  schemas:
    UserOutput:
      type: object
      required:
        - id
        - login
        - email
        - createdAt
      properties:
        id:
          type: string
          example: "abc123"
        login:
          type: string
          example: "john_doe"
        email:
          type: string
          example: "john@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2025-10-29T19:48:47.461Z"

    UserListPaginatedOutput:
      type: object
      required:
        - pagesCount
        - page
        - pageSize
        - totalCount
        - items
      properties:
        pagesCount:
          type: integer
          example: 5
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        totalCount:
          type: integer
          example: 42
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserOutput"

    UserCreateInput:
      type: object
      required:
        - login
        - password
        - email
      properties:
        login:
          type: string
          example: "tRGYgcW1e0"
        password:
          type: string
          example: "string"
        email:
          type: string
          example: "example@example.com"

    ValidationErrorListOutput:
      type: object
      required:
        - errorsMessages
      properties:
        errorsMessages:
          type: array
          items:
            type: object
            required:
              - message
              - field
            properties:
              message:
                type: string
                example: "Invalid email format"
              field:
                type: string
                example: "email"
