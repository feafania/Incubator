openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0

tags:
  - name: Posts
    description: API for managing posts
  - name: Comments
    description: API for managing comments

paths:
  /posts:
    get:
      summary: Returns posts with paging and sorting
      tags: [Posts]
      parameters:
        - name: sortBy
          in: query
          description: Field to sort by (e.g. createdAt, title)
          required: false
          schema:
            type: string
            default: createdAt
        - name: sortDirection
          in: query
          description: Sorting direction
          required: false
          schema:
            $ref: "#/components/schemas/SortDirection"
        - name: pageNumber
          in: query
          description: Number of the page to return
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          description: Size of the page (number of items)
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        200:
          description: Paginated list of all posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatorPostViewModel"
        401:
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"

    post:
      summary: Create a new post
      tags: [Posts]
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        201:
          description: The post was successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostViewModel"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"
        401:
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"

  /posts/{id}:
    get:
      summary: Get a specific post by ID
      tags: [Posts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: The post was successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostViewModel"
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"

    put:
      summary: Update a post by ID
      tags: [Posts]
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        204:
          description: The post was successfully updated
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"
        401:
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"

    delete:
      summary: Delete a post by ID
      tags: [Posts]
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: The post was successfully deleted
        401:
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"

  /posts/delete-all:
    delete:
      summary: Delete all posts
      tags: [Posts]
      security:
        - basicAuth: []
      responses:
        204:
          description: All posts were successfully deleted
        401:
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"

  /posts/{postId}/comments:
    get:
      summary: Returns comments for specified post
      tags: [Comments]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: createdAt
        - name: sortDirection
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SortDirection"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatorCommentViewModel"
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"

    post:
      summary: Create new comment
      tags: [Comments]
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        201:
          description: Returns the newly created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentViewModel"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"
        404:
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResult"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SortDirection:
      type: string
      enum:
        - asc
        - desc

    FieldError:
      type: object
      properties:
        message:
          type: string
        field:
          type: string

    APIErrorResult:
      type: object
      properties:
        errorsMessages:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          nullable: true

    PaginatorPostViewModel:
      type: object
      required:
        - pagesCount
        - page
        - pageSize
        - totalCount
        - items
      properties:
        pagesCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostViewModel"

    PostInput:
      type: object
      required:
        - title
        - shortDescription
        - content
        - blogId
      properties:
        title:
          type: string
          maxLength: 30
        shortDescription:
          type: string
          maxLength: 100
        content:
          type: string
          maxLength: 1000
        blogId:
          type: string

    PostViewModel:
      type: object
      required:
        - id
        - title
        - shortDescription
        - content
        - blogId
        - blogName
        - createdAt
      properties:
        id:
          type: string
        title:
          type: string
        shortDescription:
          type: string
        content:
          type: string
        blogId:
          type: string
        blogName:
          type: string
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          maxLength: 300

    CommentViewModel:
      type: object
      required:
        - id
        - content
        - commentatorInfo
        - createdAt
      properties:
        id:
          type: string
        content:
          type: string
        commentatorInfo:
          type: object
          properties:
            userId:
              type: string
            userLogin:
              type: string
        createdAt:
          type: string
          format: date-time

    PaginatorCommentViewModel:
      type: object
      required:
        - pagesCount
        - page
        - pageSize
        - totalCount
        - items
      properties:
        pagesCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommentViewModel"
