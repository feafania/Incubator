openapi: 3.0.0
info:
  title: Comments API Documentation
  version: 1.1.0

tags:
  - name: Comments
    description: API for managing comments
  - name: Likes
    description: API for likes/dislikes on comments

paths:
  /comments/{id}:
    get:
      summary: Get comment by id
      tags: [Comments]
      parameters:
        - in: path
          name: id
          required: true
          description: Id of existing comment
          schema:
            type: string
      responses:
        200:
          description: Success — comment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentViewModel"
        404:
          description: Comment not found

    put:
      summary: Update existing comment by id
      tags: [Comments]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Comment id to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdateInput"
      responses:
        204:
          description: No Content — comment updated successfully
        400:
          description: Invalid input model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        401:
          description: Unauthorized
        403:
          description: Forbidden — trying to edit someone else’s comment
        404:
          description: Comment not found

    delete:
      summary: Delete comment by id
      tags: [Comments]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Comment id
          schema:
            type: string
      responses:
        204:
          description: No Content — comment deleted successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden — trying to delete someone else’s comment
        404:
          description: Comment not found

  /comments/{commentId}/like-status:
    put:
      summary: Set like status for comment
      tags: [Likes]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: commentId
          required: true
          description: Comment id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LikeInputModel"
      responses:
        204:
          description: No Content — like status updated
        400:
          description: Invalid input model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        401:
          description: Unauthorized
        404:
          description: Comment not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CommentUpdateInput:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: "Updated comment text"

    LikeInputModel:
      type: object
      required:
        - likeStatus
      properties:
        likeStatus:
          type: string
          enum:
            - None
            - Like
            - Dislike
          example: Like

    CommentatorInfo:
      type: object
      required:
        - userId
        - userLogin
      properties:
        userId:
          type: string
          example: "a1b2c3d4"
        userLogin:
          type: string
          example: "sensei"

    LikesInfo:
      type: object
      required:
        - likesCount
        - dislikesCount
        - myStatus
      properties:
        likesCount:
          type: integer
          example: 10
        dislikesCount:
          type: integer
          example: 2
        myStatus:
          type: string
          enum:
            - None
            - Like
            - Dislike
          example: None

    CommentViewModel:
      type: object
      required:
        - id
        - content
        - commentatorInfo
        - createdAt
        - likesInfo
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        content:
          type: string
          example: "This is a sample comment"
        commentatorInfo:
          $ref: "#/components/schemas/CommentatorInfo"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-03T21:26:35.347Z"
        likesInfo:
          $ref: "#/components/schemas/LikesInfo"

    ValidationErrorListOutput:
      type: object
      required:
        - errorsMessages
      properties:
        errorsMessages:
          type: array
          items:
            type: object
            required:
              - message
              - field
            properties:
              message:
                type: string
                description: Error message
                example: "Invalid value"
              field:
                type: string
                description: Field name where validation failed
                example: "content"