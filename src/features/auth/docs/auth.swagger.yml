openapi: 3.0.0
info:
  title: Auth API Documentation
  version: 1.0.0

tags:
  - name: Login
    description: API for user login

paths:
  /auth/login:
    post:
      summary: Try login user to the system
      tags: [Login]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputModel"
      responses:
        204:
          description: Login and password are correct, no content returned
        400:
          description: Input model has incorrect values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        401:
          description: Password or login is wrong

  /auth/me:
    get:
      summary: Get information about current user
      tags: [Login]
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeViewModel"
        401:
          description: Unauthorized

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

  schemas:
    # === Аўтэнтыфікацыя ===
    LoginInputModel:
      type: object
      required:
        - loginOrEmail
        - password
      properties:
        loginOrEmail:
          type: string
          example: user@example.com
        password:
          type: string
          format: password
          example: "12345678"

    LoginSuccessViewModel:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    MeViewModel:
      type: object
      required:
        - email
        - login
        - userId
      properties:
        email:
          type: string
          example: user@example.com
        login:
          type: string
          example: johndoe
        userId:
          type: string
          example: "1234567890abcdef"

    # === Валідацыйныя памылкі ===
    ValidationErrorOutput:
      type: object
      properties:
        message:
          type: string
        field:
          type: string

    ValidationErrorListOutput:
      type: object
      properties:
        errorsMessages:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorOutput"
