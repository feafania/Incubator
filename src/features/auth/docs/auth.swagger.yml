openapi: 3.0.0
info:
  title: Auth API Documentation
  version: 1.0.0
  description: >
    API endpoints for user authentication, token refreshing, logout, registration,
    and email confirmation.

tags:
  - name: Auth
    description: Authentication and registration endpoints

paths:
  /auth/login:
    post:
      summary: Try login user to the system
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputModel"
      responses:
        200:
          description: >
            Returns JWT accessToken (expired after 10 seconds) in body and JWT refreshToken
            in cookie (http-only, secure) (expired after 20 seconds).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessViewModel"
        400:
          description: If the inputModel has incorrect values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        401:
          description: If the password or login or email is wrong

  /auth/refresh-token:
    post:
      summary: Generate new pair of access and refresh tokens
      description: >
        Client must send valid refreshToken in cookie. After refreshing, old token is revoked.
      tags: [Auth]
      responses:
        200:
          description: >
            Returns new pair: JWT accessToken (10s) in body, refreshToken (20s) in cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessViewModel"
        401:
          description: Unauthorized

  /auth/logout:
    post:
      summary: Logout user
      description: >
        Client must send refreshToken in cookie. Token will be revoked.
      tags: [Auth]
      responses:
        204:
          description: No Content
        401:
          description: Unauthorized

  /auth/me:
    get:
      summary: Get information about current user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeViewModel"
        401:
          description: Unauthorized

  /auth/registration:
    post:
      summary: Registration in the system
      description: >
        Email with confirmation code will be sent to passed email address.
        Confirmation link example:
        https://some-front.com/confirm-registration?code=yourcodehere
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInputModel"
      responses:
        204:
          description: Email sent
        400:
          description: Incorrect input or user already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /auth/registration-confirmation:
    post:
      summary: Confirm registration
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationConfirmationInputModel"
      responses:
        204:
          description: Email verified. Account activated.
        400:
          description: Code incorrect, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /auth/registration-email-resending:
    post:
      summary: Resend registration confirmation email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailResendingInputModel"
      responses:
        204:
          description: Email sent
        400:
          description: Incorrect input or email already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # === Login ===
    LoginInputModel:
      type: object
      required:
        - loginOrEmail
        - password
      properties:
        loginOrEmail:
          type: string
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "12345678"

    LoginSuccessViewModel:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    # === Me ===
    MeViewModel:
      type: object
      required:
        - email
        - login
        - userId
      properties:
        email:
          type: string
          example: "user@example.com"
        login:
          type: string
          example: "johndoe"
        userId:
          type: string
          example: "1234567890abcdef"

    # === Registration ===
    RegistrationInputModel:
      type: object
      required:
        - login
        - password
        - email
      properties:
        login:
          type: string
          example: "Pb7nqAOVAJ"
        password:
          type: string
          example: "string"
        email:
          type: string
          format: email
          example: "example@example.com"

    RegistrationConfirmationInputModel:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          example: "string"

    EmailResendingInputModel:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "example@example.com"

    # === Errors ===
    ValidationErrorOutput:
      type: object
      properties:
        message:
          type: string
          example: "Invalid email format"
        field:
          type: string
          example: "email"

    ValidationErrorListOutput:
      type: object
      properties:
        errorsMessages:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorOutput"