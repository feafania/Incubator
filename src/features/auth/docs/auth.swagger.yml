openapi: 3.0.0
info:
  title: Auth API Documentation
  version: 1.0.0
  description: >
    API endpoints for authentication, token refreshing, logout, registration,
    email confirmation, password recovery and new password confirmation.

tags:
  - name: Auth
    description: Authentication, registration and password recovery endpoints

paths:
  /auth/login:
    post:
      summary: Try login user to the system
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputModel"
      responses:
        200:
          description: >
            Returns JWT accessToken (expired after 10 seconds) in body and JWT refreshToken
            in cookie (http-only, secure) (expired after 20 seconds).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessViewModel"
        400:
          description: If the inputModel has incorrect values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        401:
          description: If password or login/email is wrong
        429:
          description: More than 5 attempts from one IP-address during 10 seconds

  /auth/refresh-token:
    post:
      summary: Generate new pair of access and refresh tokens
      tags: [Auth]
      description: >
        Client must send valid refreshToken in cookie. After refreshing, old token is revoked.
      responses:
        200:
          description: Returns new accessToken and refreshToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessViewModel"
        401:
          description: Unauthorized

  /auth/logout:
    post:
      summary: Logout user
      tags: [Auth]
      description: Client must send refreshToken in cookie. Token will be revoked.
      responses:
        204:
          description: No Content
        401:
          description: Unauthorized

  /auth/me:
    get:
      summary: Get information about current user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeViewModel"
        401:
          description: Unauthorized

  /auth/registration:
    post:
      summary: Registration in the system
      tags: [Auth]
      description: >
        Email with confirmation code will be sent to passed email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInputModel"
      responses:
        204:
          description: Email with confirmation code was sent
        400:
          description: Incorrect input or user already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        429:
          description: More than 5 attempts from one IP-address during 10 seconds

  /auth/registration-confirmation:
    post:
      summary: Confirm registration
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationConfirmationInputModel"
      responses:
        204:
          description: Email verified. Account activated.
        400:
          description: Code incorrect, expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        429:
          description: More than 5 attempts from one IP-address during 10 seconds

  /auth/registration-email-resending:
    post:
      summary: Resend registration confirmation email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailResendingInputModel"
      responses:
        204:
          description: Email sent
        400:
          description: Incorrect input or email already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        429:
          description: More than 5 attempts from one IP-address during 10 seconds

  /hometask_10/api/auth/password-recovery:
    post:
      summary: Password recovery via Email confirmation
      description: >
        Email should be sent with RecoveryCode inside.
        Even if email is not registered, response is 204 (to prevent user detection).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryInputModel"
      responses:
        204:
          description: Email sent (or skipped if user unknown)
        400:
          description: Invalid email
        429:
          description: More than 5 attempts from one IP-address during 10 seconds

  /hometask_10/api/auth/new-password:
    post:
      summary: Confirm password recovery and set new password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPasswordInputModel"
      responses:
        204:
          description: Password successfully changed
        400:
          description: Incorrect input or recovery code invalid/expired
        429:
          description: More than 5 attempts from one IP-address during 10 seconds

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginInputModel:
      type: object
      required:
        - loginOrEmail
        - password
      properties:
        loginOrEmail:
          type: string
        password:
          type: string

    LoginSuccessViewModel:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string

    MeViewModel:
      type: object
      required:
        - email
        - login
        - userId
      properties:
        email:
          type: string
        login:
          type: string
        userId:
          type: string

    RegistrationInputModel:
      type: object
      required:
        - login
        - password
        - email
      properties:
        login:
          type: string
        password:
          type: string
        email:
          type: string
          format: email

    RegistrationConfirmationInputModel:
      type: object
      required:
        - code
      properties:
        code:
          type: string

    EmailResendingInputModel:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    PasswordRecoveryInputModel:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "useremail@company.com"

    NewPasswordInputModel:
      type: object
      required:
        - newPassword
        - recoveryCode
      properties:
        newPassword:
          type: string
          example: "string"
        recoveryCode:
          type: string
          example: "string"

    ValidationErrorOutput:
      type: object
      required:
        - message
        - field
      properties:
        message:
          type: string
        field:
          type: string

    ValidationErrorListOutput:
      type: object
      required:
        - errorsMessages
      properties:
        errorsMessages:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorOutput"
